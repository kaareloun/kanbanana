name: release

# Runs when a version tag like v0.2.0 is pushed (scripts/release.sh does that).
# Two independent tracks, because macOS runners are scarce and can wait a long time:
# - Linux: build, create the GitHub release, publish both AUR packages.
# - macOS: build both Mac targets, add them to the same release, update the Homebrew formula.
# A slow or cancelled macOS job never holds back the Linux release; re-run it on its own.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag must match the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$cargo_version" ]; then
            echo "Tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ Linux track

  build-linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: linux
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      # CI skips the release commit, so the tests run here.
      - run: cargo test --workspace --locked
      - name: Build and package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: scripts/package-release.sh x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: kanbanana-*.tar.gz*
          if-no-files-found: error

  release-linux:
    needs: [check, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Create the release with the Linux archive
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          generate_release_notes: true

  aur:
    needs: [check, release-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Set the version in both PKGBUILDs
        run: |
          for p in packaging/aur/PKGBUILD packaging/aur-bin/PKGBUILD; do
            sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" "$p"
          done
      - name: Publish kanbanana-bin to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: kanbanana-bin
          pkgbuild: packaging/aur-bin/PKGBUILD
          updpkgsums: true
          commit_username: kaareloun
          commit_email: kaareloun@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.check.outputs.version }}
          ssh_keyscan_types: ed25519
      - name: Publish kanbanana to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: kanbanana
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: kaareloun
          commit_email: kaareloun@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.check.outputs.version }}
          ssh_keyscan_types: ed25519
      - name: Commit the PKGBUILDs to main
        run: scripts/commit-to-main.sh "chore: update aur packages for v${VERSION}" packaging/aur/PKGBUILD packaging/aur-bin/PKGBUILD

  # ------------------------------------------------------------------ macOS track

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: macos
      - name: Build and package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          scripts/package-release.sh aarch64-apple-darwin
          scripts/package-release.sh x86_64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: kanbanana-*.tar.gz*
          if-no-files-found: error

  homebrew:
    # Waits for the Linux release, because the formula also points at the Linux archive.
    needs: [check, build-macos, release-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add the macOS archives to the release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: |
            dist/*apple-darwin.tar.gz
            dist/*apple-darwin.tar.gz.sha256
      - name: Write the Homebrew formula
        run: |
          sha() { cut -d' ' -f1 "dist/kanbanana-v${VERSION}-$1.tar.gz.sha256"; }
          mkdir -p Formula
          sed -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA_MAC_ARM}}/$(sha aarch64-apple-darwin)/" \
              -e "s/{{SHA_MAC_INTEL}}/$(sha x86_64-apple-darwin)/" \
              -e "s/{{SHA_LINUX}}/$(sha x86_64-unknown-linux-gnu)/" \
              packaging/homebrew/kanbanana.rb.tmpl > Formula/kanbanana.rb
      - name: Commit the formula to main
        run: scripts/commit-to-main.sh "chore: update homebrew formula for v${VERSION}" Formula/kanbanana.rb
