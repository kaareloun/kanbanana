name: release

# Runs when a version tag like v0.2.0 is pushed (scripts/release.sh does that). It builds
# the app, publishes the GitHub release, then updates the Homebrew formula in this repo and
# the package in the AUR. Everything lives in this repo: it is also the Homebrew tap.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag must match the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$tag" != "$cargo_version" ]; then
            echo "Tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Built on the Apple silicon runner too: Intel runners are being retired.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked -p kanbanana --target ${{ matrix.target }}
      - name: Package
        run: |
          name="kanbanana-v${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kanbanana" LICENSE README.md \
            assets/kanbanana.desktop assets/brand/icon.png assets/brand/icon.svg "$name/"
          cp -r assets/brand/icons "$name/icons"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: kanbanana-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          generate_release_notes: true

  packages:
    needs: [check, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the Homebrew formula and the PKGBUILD
        run: |
          sha() { cut -d' ' -f1 "dist/kanbanana-v${VERSION}-$1.tar.gz.sha256"; }
          mkdir -p Formula
          sed -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA_MAC_ARM}}/$(sha aarch64-apple-darwin)/" \
              -e "s/{{SHA_MAC_INTEL}}/$(sha x86_64-apple-darwin)/" \
              -e "s/{{SHA_LINUX}}/$(sha x86_64-unknown-linux-gnu)/" \
              packaging/homebrew/kanbanana.rb.tmpl > Formula/kanbanana.rb
          for p in packaging/aur/PKGBUILD packaging/aur-bin/PKGBUILD; do
            sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" "$p"
          done
      - name: Commit them to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanbanana.rb packaging/aur/PKGBUILD packaging/aur-bin/PKGBUILD
          if ! git diff --cached --quiet; then
            git commit -m "chore: update packages for v${VERSION}"
            git push origin main
          fi
      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: kanbanana
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: kaareloun
          commit_email: kaareloun@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.check.outputs.version }}
          ssh_keyscan_types: ed25519
      - name: Publish the prebuilt package to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: kanbanana-bin
          pkgbuild: packaging/aur-bin/PKGBUILD
          updpkgsums: true
          commit_username: kaareloun
          commit_email: kaareloun@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.check.outputs.version }}
          ssh_keyscan_types: ed25519
