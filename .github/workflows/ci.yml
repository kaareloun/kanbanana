name: ci

# Tags and the "chore: release vX" commit are built and tested by release.yml.
# CI runs on Linux only. Free macOS runners are scarce, so they stay free for releases,
# which still build both macOS targets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for eframe
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace
      - run: cargo build --release -p kanbanana
